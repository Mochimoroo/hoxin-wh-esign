<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoxin WH e-Sign</title>
<meta name="description" content="ระบบเอกสารคลังสินค้า ใบเบิก · ใบนำเข้า · DN พร้อมลงนามอิเล็กทรอนิกส์ - Hoxin Precision (Thailand)">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WH e-Sign">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --blue:#1e3a8a; --ink:#0f172a; --muted:#64748b; --bg:#f5f7fb; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:var(--bg); }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; background:#fff; z-index:2; transition:opacity .35s ease; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash img { width:min(62vw, 260px); height:auto; }
  .bar { width:min(50vw, 200px); height:4px; border-radius:4px; background:#e2e8f0; overflow:hidden; }
  .bar::after { content:""; display:block; width:40%; height:100%; background:var(--blue); border-radius:4px;
    animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform:translateX(-100%); } 100% { transform:translateX(250%); } }
  #msg { color:var(--muted); font-size:14px; text-align:center; padding:0 24px; min-height:20px; }
  #retry { display:none; border:0; background:var(--blue); color:#fff; font-size:15px; font-weight:600;
    padding:12px 28px; border-radius:10px; }
  #retry.show { display:block; }
</style>
</head>
<body>
  <div id="splash">
    <img src="logo.jpg" alt="Hoxin Precision (Thailand) Co., Ltd.">
    <div class="bar" id="bar"></div>
    <div id="msg">กำลังเปิดระบบ…</div>
    <button id="retry" type="button" onclick="location.reload()">ลองใหม่</button>
  </div>
  <iframe id="app" title="Hoxin WH e-Sign"
          allow="camera; clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  // ลิงก์ระบบ Hoxin Smart Material Issue (Google Apps Script)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzST9zw5-RvOKXKdBWXgiOTxZPFC9N4VLP7JvJgvZxlDB63UmDD2x9sww7atC11PWo/exec';
  // ส่งต่อเลขที่เอกสาร เช่น ?r=3310-2611070002 (ใช้ทำ QR Code เปิดเอกสารตรงจากแอป)
  var m = /[?&]r=([A-Za-z0-9\-\/]{4,40})/.exec(location.search);
  var target = APP_URL + (m ? '?r=' + encodeURIComponent(m[1]) : '');
  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  var msg = document.getElementById('msg'), retry = document.getElementById('retry'), bar = document.getElementById('bar');

  function fail(text) {
    msg.textContent = text; bar.style.display = 'none'; retry.className = 'show';
    splash.className = '';
  }
  function start() {
    if (!navigator.onLine) { fail('ไม่มีอินเทอร์เน็ต กรุณาเชื่อมต่อ Wi-Fi หรือเน็ตมือถือ แล้วกด "ลองใหม่"'); return; }
    var loaded = false;
    frame.onload = function () { loaded = true; setTimeout(function () { splash.className = 'hide'; }, 250); };
    frame.src = target;
    setTimeout(function () { if (!loaded) msg.textContent = 'อินเทอร์เน็ตช้า กำลังโหลด…'; }, 8000);
    setTimeout(function () { if (!loaded) fail('เปิดระบบไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต แล้วกด "ลองใหม่"'); }, 30000);
  }
  window.addEventListener('offline', function () { msg.textContent = 'อินเทอร์เน็ตหลุด'; });
  start();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
